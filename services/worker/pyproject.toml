[project]
name = "kerf-worker"
version = "0.1.0"
description = "Kerf arq background worker"
requires-python = ">=3.11"
dependencies = [
    "arq>=0.26.0",
    "redis>=5.0.4",
    "pydantic>=2.7.0",
    "kerf-schema"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kerf_worker"]

[tool.uv.sources]
kerf-schema = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]
