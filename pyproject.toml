[project]
name = "kerf-monorepo"
version = "0.1.0"
description = "Kerf monorepo root"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[tool.uv.workspace]
members = [
    "apps/api",
    "services/worker",
    "packages/schema"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.91.0",
]
