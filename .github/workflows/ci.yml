name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pnpm install
          uv sync --all-packages

      - name: Run JS/TS Typecheck & Lint
        run: |
          pnpm typecheck
          pnpm lint

      - name: Run Python Ruff & Mypy
        run: |
          uv run ruff check .
          uv run mypy apps/api/kerf services/worker/kerf_worker

      - name: Verify Codegen Determinism & Parity
        run: |
          pnpm codegen
          git diff --exit-code

  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start Docker Services
        run: |
          docker compose up -d
          # Wait for services to be ready
          timeout=30
          while [ $timeout -gt 0 ]; do
            if docker compose exec -T postgres pg_isready -U kerf > /dev/null 2>&1 && docker compose exec -T redis redis-cli ping > /dev/null 2>&1; then
              echo "Services ready!"
              break
            fi
            echo "Waiting for services..."
            sleep 2
            timeout=$((timeout - 2))
          done
          docker compose ps

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pnpm install
          uv sync --all-packages

      - name: Run Alembic Migrations
        run: |
          cd apps/api
          uv run alembic upgrade head

      - name: Run JS/TS Unit Tests
        run: pnpm test

      - name: Run Python Unit Tests
        run: uv run pytest
