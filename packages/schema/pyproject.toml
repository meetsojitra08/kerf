[project]
name = "kerf-schema"
version = "0.1.0"
description = "Kerf schema package"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "datamodel-code-generator>=0.25.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/kerf_schema"]
